<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matematika Játszóház</title>
  <style>body { margin:0; background:#f5f5fc; }

#matek-jatszohaz {
  --ink:#202342; --muted:#505673; --paper:#f5f5fc; --line:#dedff0;
  --accent:#4935a9; --pale:#eae4ff; --navy:#26224b; --green:#126342;
  --soft-green:#e5f6ed; --warm:#fff0db; --brown:#743e13;
  box-sizing:border-box; width:100%; min-height:500px; padding:clamp(14px,4vw,40px);
  background:var(--paper); color:var(--ink); font:400 1rem/1.55 system-ui,sans-serif; border-radius:22px;
}
#matek-jatszohaz *, #matek-jatszohaz *::before, #matek-jatszohaz *::after { box-sizing:border-box }
#matek-jatszohaz h1, #matek-jatszohaz h2, #matek-jatszohaz h3, #matek-jatszohaz p { margin:0 }
#matek-jatszohaz h1, #matek-jatszohaz h2 { line-height:1.14; letter-spacing:-.035em; text-wrap:balance }
#matek-jatszohaz h1 { font-size:clamp(1.5rem,4.8vw,2.45rem) }
#matek-jatszohaz h2 { font-size:clamp(1.35rem,4vw,2rem) }
#matek-jatszohaz button, #matek-jatszohaz input, #matek-jatszohaz textarea { font:inherit }
#matek-jatszohaz button { cursor:pointer }
#matek-jatszohaz button:disabled { cursor:default }
#matek-jatszohaz button:focus-visible, #matek-jatszohaz input:focus-visible, #matek-jatszohaz textarea:focus-visible { outline:3px solid #9773ee; outline-offset:3px }
#matek-jatszohaz .wrap { max-width:840px; margin:auto }
#matek-jatszohaz .top, #matek-jatszohaz .brand, #matek-jatszohaz .cluster { display:flex; align-items:center; flex-wrap:wrap; gap:10px }
#matek-jatszohaz .top { justify-content:space-between; margin-bottom:22px }
#matek-jatszohaz .brand { flex-wrap:nowrap; font-weight:750; letter-spacing:-.025em }
#matek-jatszohaz .mark { display:grid; place-items:center; width:40px; height:40px; border-radius:12px; color:#fff; background:var(--accent); font-size:1.6rem }
#matek-jatszohaz .hero { position:relative; isolation:isolate; overflow:hidden; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:20px; align-items:center; padding:clamp(18px,4vw,30px); margin-bottom:18px; border-radius:19px; background:var(--navy); color:#fff }
#matek-jatszohaz .hero::after { content:""; position:absolute; z-index:-1; right:-70px; top:-155px; width:240px; height:240px; border:36px solid #42386e; border-radius:50% }
#matek-jatszohaz .hero p { margin-top:7px; color:#e3ddff }
#matek-jatszohaz .hero-cards { display:flex; align-items:center; padding-right:8px }
#matek-jatszohaz .hero-cards span { display:grid; place-items:center; width:45px; height:61px; border-radius:9px; box-shadow:0 5px 14px #1e193b70; font-weight:800; font-size:1.38rem; background:#e5d8ff; color:#36225d; transform:rotate(-13deg) }
#matek-jatszohaz .hero-cards span + span { margin-left:-8px; background:#ffd498; color:#4b2e25; transform:rotate(10deg) }
#matek-jatszohaz .surface { padding:clamp(15px,3.8vw,27px); border:1px solid var(--line); border-radius:18px; background:#fff }
#matek-jatszohaz .catalog { margin-top:16px; display:grid; gap:14px }
#matek-jatszohaz .set-card { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:start; gap:15px }
#matek-jatszohaz .set-card .cluster { margin-top:10px }
#matek-jatszohaz .set-card p, #matek-jatszohaz .meta { color:var(--muted) }
#matek-jatszohaz .set-card h2 { margin-bottom:5px }
#matek-jatszohaz .matched { margin-top:9px }
#matek-jatszohaz .tag, #matek-jatszohaz .button, #matek-jatszohaz .task-link, #matek-jatszohaz .answer-card {
  min-height:44px; padding:8px 14px; border:1px solid var(--line); border-radius:10px; color:var(--ink); background:#fff; font-weight:650;
}
#matek-jatszohaz .tag { border-radius:24px; font-size:.9rem; color:var(--accent) }
#matek-jatszohaz .tag[aria-pressed=true], #matek-jatszohaz .answer-card[aria-pressed=true] { background:var(--pale); border-color:var(--accent); color:var(--accent) }
#matek-jatszohaz .button.primary { border-color:var(--accent); background:var(--accent); color:#fff }
#matek-jatszohaz .button:hover:not(:disabled), #matek-jatszohaz .tag:hover, #matek-jatszohaz .task-link:hover, #matek-jatszohaz .answer-card:hover { box-shadow:inset 0 0 0 1px currentColor }
#matek-jatszohaz .button:disabled { opacity:.52 }
#matek-jatszohaz .tag-label { padding:3px 9px; border-radius:20px; background:var(--pale); color:var(--accent); font-size:.86rem; font-weight:650 }
#matek-jatszohaz input[type=search], #matek-jatszohaz input[type=text], #matek-jatszohaz textarea { display:block; width:100%; margin-top:6px; padding:10px 12px; border:1px solid #a7a6c4; border-radius:9px; color:var(--ink); background:#fff }
#matek-jatszohaz input[inputmode=numeric] { max-width:160px }
#matek-jatszohaz textarea { resize:vertical; min-height:96px }
#matek-jatszohaz .search-area label { display:block; margin-bottom:9px; font-weight:650 }
#matek-jatszohaz .topic-bar { gap:6px; margin-bottom:14px }
#matek-jatszohaz .search-suggestions, #matek-jatszohaz .browse-tags { margin-top:12px }
#matek-jatszohaz .search-suggestions .cluster, #matek-jatszohaz .browse-tags .cluster { gap:6px; margin-top:6px }
#matek-jatszohaz .browse-tags > summary { min-height:44px; width:fit-content; max-width:100%; padding:9px 0; color:var(--accent); font-weight:650; cursor:pointer }
#matek-jatszohaz .browse-tags > summary:focus-visible { outline:3px solid #9773ee; outline-offset:3px }
#matek-jatszohaz .tag-list { max-height:17rem; overflow:auto; padding:4px; margin:-4px }
#matek-jatszohaz .selected-tag:not(:empty) { margin-top:9px }
#matek-jatszohaz .selected-tag > .tag { background:var(--pale); border-color:var(--accent) }
#matek-jatszohaz .task-nav { display:grid; grid-template-columns:repeat(auto-fit,minmax(44px,1fr)); gap:6px; margin:10px 0 15px }
#matek-jatszohaz .task-link { padding:5px 2px; font-variant-numeric:tabular-nums }
#matek-jatszohaz .task-link[data-status=solved] { color:var(--green); background:var(--soft-green) }
#matek-jatszohaz .task-link[data-status=reviewed] { color:var(--brown); background:var(--warm) }
#matek-jatszohaz .task-link[aria-current=step] { outline:2px solid var(--accent); outline-offset:-2px }
#matek-jatszohaz .task-body { margin:12px 0 20px }
#matek-jatszohaz .field { margin-bottom:15px }
#matek-jatszohaz .field label, #matek-jatszohaz legend { font-weight:650 }
#matek-jatszohaz fieldset { padding:0; margin:0; border:0; min-width:0 }
#matek-jatszohaz legend { padding:0; margin-bottom:7px }
#matek-jatszohaz .options { display:flex; gap:8px; flex-wrap:wrap }
#matek-jatszohaz .playing-cards { display:grid; grid-template-columns:repeat(4,minmax(45px,63px)); gap:6px }
#matek-jatszohaz .playing-cards .answer-card { padding:0 4px; height:78px; font-size:1.75rem; box-shadow:0 3px 0 #dedff0 }
#matek-jatszohaz .field-feedback, #matek-jatszohaz .feedback { margin-top:6px; font-size:.93rem; font-weight:650; color:var(--brown) }
#matek-jatszohaz [data-result=correct] { color:var(--green) }
#matek-jatszohaz .feedback:empty, #matek-jatszohaz .field-feedback:empty { display:none }
#matek-jatszohaz .support { margin-top:14px; display:grid; gap:9px }
#matek-jatszohaz .support:empty { display:none }
#matek-jatszohaz .support section { padding:12px 14px; border-radius:10px; background:var(--warm) }
#matek-jatszohaz .support section.solution { background:var(--soft-green) }
#matek-jatszohaz .support p { white-space:pre-line }
#matek-jatszohaz .support h3 { font-size:1rem; margin-bottom:3px }
#matek-jatszohaz .footer { margin-top:16px; justify-content:space-between }
#matek-jatszohaz .summary-list { list-style:none; margin:14px 0 0; padding:0 }
#matek-jatszohaz .summary-list li+li { border-top:1px solid var(--line) }
#matek-jatszohaz .summary-link { display:flex; justify-content:space-between; align-items:center; gap:12px; width:100%; padding:10px 4px; text-align:left; border:0; color:var(--ink); background:transparent; min-height:46px }
#matek-jatszohaz .summary-link:hover { color:var(--accent); text-decoration:underline }
#matek-jatszohaz .summary-link span:last-child { font-size:.87rem; color:var(--muted); text-align:right }
#matek-jatszohaz .muted { color:var(--muted); font-size:.9rem }
#matek-jatszohaz .source-download { margin:16px 0 0; text-align:right }
#matek-jatszohaz .source-download a { color:var(--accent); text-underline-offset:3px }
@media (max-width:530px) {
  #matek-jatszohaz .set-card { grid-template-columns:1fr }
  #matek-jatszohaz .playing-cards .answer-card { height:62px }
}

#matek-jatszohaz .dialogue { margin:13px 0; padding:8px 12px; border-left:3px solid var(--line); background:var(--paper); border-radius:0 9px 9px 0 }
#matek-jatszohaz .dialogue div { display:grid; grid-template-columns:minmax(100px, 123px) minmax(0, 1fr); gap:8px; padding:4px 0 }
#matek-jatszohaz .dialogue dt { font-weight:700 }
#matek-jatszohaz .dialogue dd { margin:0 }
#matek-jatszohaz figure { margin:12px 0 0; padding:8px; max-width:360px; border:1px solid var(--line); border-radius:12px; background:var(--paper) }
#matek-jatszohaz figure svg { display:block; width:100%; height:auto; overflow:hidden }
#matek-jatszohaz figure svg text { fill:var(--ink); font-family:system-ui,sans-serif; font-size:14px; font-weight:650 }
#matek-jatszohaz figcaption { margin-top:4px; font-weight:650; text-align:center }
#matek-jatszohaz .figure-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 225px), 1fr)); gap:8px }
#matek-jatszohaz .diagram-edge { fill:none; stroke:var(--ink); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round }
#matek-jatszohaz .diagram-fill { fill:#eeebfc }
#matek-jatszohaz .diagram-guide { stroke:#5f518c; stroke-dasharray:4 4 }
#matek-jatszohaz .diagram-accent { stroke:var(--accent); stroke-width:2.8 }
#matek-jatszohaz .diagram-point { fill:var(--ink) }
#matek-jatszohaz .weight { stroke:var(--ink); stroke-width:1.35 }
#matek-jatszohaz .weight.square { fill:#9283ce }
#matek-jatszohaz .weight.round { fill:#cbe0ef }
#matek-jatszohaz .weight.triangle { fill:#ffd498 }
#matek-jatszohaz .weight.pentagon { fill:#a7dcc3 }
#matek-jatszohaz .solution .button { margin-top:10px }
@media (max-width:420px) { #matek-jatszohaz .dialogue div { grid-template-columns:1fr; gap:0 } }

#matek-jatszohaz .activity { margin:18px 0; padding:clamp(9px,3vw,16px); border:1px solid var(--line); border-radius:14px; background:var(--paper) }
#matek-jatszohaz .activity h2 { font-size:1.19rem; margin-bottom:5px }
#matek-jatszohaz .activity-steps, #matek-jatszohaz .activity-actions, #matek-jatszohaz .activity-note { margin-top:11px }
#matek-jatszohaz .activity-steps + .cluster { margin-top:11px }
#matek-jatszohaz .activity-note { margin-bottom:8px }
#matek-jatszohaz .activity .button[aria-pressed=true] { background:var(--pale); color:var(--accent); border-color:var(--accent) }
#matek-jatszohaz .scale-weights { display:grid; grid-template-columns:repeat(9,minmax(37px,1fr)); gap:5px; margin:8px 0 }
#matek-jatszohaz .scale-weight { min-height:48px; padding:2px 4px; border:1px solid #aaa6ca; border-radius:9px; background:#fff; color:var(--ink); font-weight:700 }
#matek-jatszohaz .scale-weight:hover { border-color:var(--accent) }
#matek-jatszohaz .scale-weight small { display:block; font-size:.76rem; font-weight:750; line-height:1.10 }
#matek-jatszohaz .scale-weight[data-place=left] { background:var(--pale); border-color:var(--accent); color:var(--accent) }
#matek-jatszohaz .scale-weight[data-place=right] { background:#e0f1f3; border-color:#26626b; color:#1b525d }
#matek-jatszohaz .scale-trays { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin:9px 0 6px }
#matek-jatszohaz .scale-tray { display:grid; text-align:center; padding:5px 3px; border:1px solid #a7a6c4; border-radius:4px 4px 15px 15px; background:#fff; font-variant-numeric:tabular-nums }
#matek-jatszohaz .scale-tray span { color:var(--muted) }
#matek-jatszohaz .truth-table { margin:9px 0; table-layout:fixed; border-collapse:separate; border-spacing:2px; width:100%; max-width:560px }
#matek-jatszohaz .truth-table th, #matek-jatszohaz .truth-table td { padding:1px; text-align:center; overflow-wrap:anywhere; font-size:.88rem }
#matek-jatszohaz .truth-table tr.selected > * { background:#e5dfff }
#matek-jatszohaz .truth-name, #matek-jatszohaz .truth-cell { min-height:44px; padding:2px; width:100%; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); font-weight:650 }
#matek-jatszohaz .truth-name[aria-pressed=true] { color:var(--accent); background:var(--pale); border-color:var(--accent) }
#matek-jatszohaz .truth-cell[data-sign=I] { background:#e3f2ec; color:var(--green) }
#matek-jatszohaz .truth-cell[data-sign=H] { background:#fff0db; color:var(--brown) }
#matek-jatszohaz .truth-cell[data-checked=correct] { border-color:var(--green) }
#matek-jatszohaz .truth-cell[data-checked=wrong] { border:2px dashed #a13e36; background:#fae6e3; color:#7e342c }
#matek-jatszohaz .geo-emphasis { fill:none; stroke:var(--accent); stroke-width:2.8; stroke-linecap:round; stroke-linejoin:round }
#matek-jatszohaz .geo-guide { fill:none; stroke:#874318; stroke-width:2.5; stroke-linecap:round; stroke-dasharray:5 4 }
#matek-jatszohaz .geo-region { fill:#b9a9f4; fill-opacity:.35; stroke:none }
#matek-jatszohaz .geo-region.geo-reflection { fill:#efb46d; fill-opacity:.49 }
#matek-jatszohaz .geo-point { fill:var(--accent) }
#matek-jatszohaz #jh-task-figure figcaption { font-size:.88rem; padding:0 5px 4px; text-align:left }
@media (max-width:590px) {
  #matek-jatszohaz .scale-weights { grid-template-columns:repeat(5,minmax(0,1fr)) }
}
@media (max-width:375px) {
  #matek-jatszohaz .truth-table { border-spacing:1px }
  #matek-jatszohaz .truth-table th, #matek-jatszohaz .truth-table td { font-size:.78rem }
}
</style>
</head>

<script>
(() => {
  const read = id => JSON.parse(document.getElementById(id).textContent);

  function createScaleRules() {
  const outcomes = ["left", "even", "right"];
  const weights = Array.from({length:9}, (_,i)=>i+1);
  const group = (layout, side) => weights.filter(weight => layout[weight-1] === side);
  const weighed = (layout, weight) => layout[weight-1] || "even";
  const valid = layout => group(layout,"left").length > 0
    && group(layout,"left").length === group(layout,"right").length;

  const suspectsFor = (model,first) => weights.filter(weight=>weighed(model.first,weight)===first);

  function check(model) {
    if (!valid(model.first)) return {type:"first"};
    const checks = [];
    for (const first of outcomes) {
      const suspects = suspectsFor(model,first);
      if (suspects.length === 1) {
        checks.push({first,second:null,suspects});
        continue;
      }
      const layout = model.second[first];
      if (!valid(layout)) return {type:"second",first};
      for (const second of outcomes) {
        const found = suspects.filter(weight => weighed(layout,weight) === second);
        if (found.length) checks.push({first,second,suspects:found});
      }
    }
    const ambiguous = checks.find(entry=>entry.suspects.length>1);
    if (ambiguous) return {type:"ambiguous",...ambiguous};
    return {type:"success",checked:checks.length};
  }

  return {weights,group,valid,weighed,suspectsFor,check};
}

  function createSprintActivities({escape,save,redraw,attachPlan}, scaleRules) {
  const sides = ["left","even","right"];
  const labels = {left:"Bal nehezebb",even:"Egyensúly",right:"Jobb nehezebb"};
  const placementLabel = {left:"bal serpenyő",right:"jobb serpenyő","":"a mérlegen kívül"};
  const personas = ["Dobosi","Juli","Mobil","Zsuzsi"];
  const {weights,group,valid,weighed,suspectsFor,check:checkScalePlan} = scaleRules;
  const blankLayout = ()=>Array(weights.length).fill("");
  const asList = numbers=>numbers.join(", ");
  const truthFor = suspect=>[suspect==="Mobil",suspect!=="Juli",suspect==="Juli",suspect!=="Juli"];

  function scaleState(record) {
    return record.scale ??= {
      first:blankLayout(), second:{left:blankLayout(),even:blankLayout(),right:blankLayout()},
      stage:"first", target:"left", tested:false
    };
  }

  function truthState(record) {
    return record.truth ??= {selected:0, marks:personas.map(()=>Array(4).fill(null)), tested:[false,false,false,false]};
  }

  function describeWeighing(layout) {
    return `balra ${asList(group(layout,"left"))}, jobbra ${asList(group(layout,"right"))}`;
  }

  function savedPlan(model) {
    const second = sides.map(side=>{
      const suspects=suspectsFor(model,side);
      if (suspects.length===1) return `${labels[side]} esetén már megvan a nehezebb súly (${suspects[0]}).`;
      const layout = model.second[side];
      const route = suspects.map(weight=>`${labels[weighed(layout,weight)].toLowerCase()} esetén ${weight}`);
      return `${labels[side]} esetén a második mérésben ${describeWeighing(layout)}. A keresett súly sorszáma ${route.join(", ")}.`;
    });
    return `Az első mérésnél ${describeWeighing(model.first)}.\n${second.join("\n")}`;
  }

  function reportScale(result) {
    if (!result) return "";
    if (result.type==="first") return "Az első méréshez mindkét serpenyőbe ugyanannyi súlyt tegyél.";
    if (result.type==="second") return `„${labels[result.first]}” esetén még állíts össze egy szabályos második mérést.`;
    if (result.type==="ambiguous") return `Az első mérésnél ${labels[result.first].toLowerCase()}, a másodiknál ${labels[result.second].toLowerCase()}. Így még több súly is gyanús (${asList(result.suspects)}).`;
    return `Mind a ${result.checked} esetben egyetlen súly marad gyanús. A terved működik!`;
  }

  function tray(layout, side) {
    const numbers = group(layout,side);
    return `<div class="scale-tray"><strong>${side==="left"?"Bal":"Jobb"} serpenyő</strong>
      <span>${numbers.length ? asList(numbers) : "Üres"}</span></div>`;
  }

  function scaleHtml(record) {
    const model = scaleState(record);
    const isFirst = model.stage==="first";
    const layout = isFirst ? model.first : model.second[model.stage];
    const suspects = isFirst ? [] : suspectsFor(model,model.stage);
    const oneLeft = !isFirst && suspects.length===1;
    const result = model.tested ? checkScalePlan(model) : null;
    const successful = result?.type==="success";
    const branches = [{id:"first",text:"Első mérés"},...sides.map(side=>({id:side,text:labels[side]}))];
    const stageButtons = branches.map(({id,text}) =>
      `<button class="button" type="button" data-action="s3-scale-stage" data-value="${id}" data-s3-focus="stage-${id}" aria-pressed="${model.stage===id}" ${id!=="first"&&!valid(model.first)?"disabled":""}>${text}</button>`).join("");
    const targets = [["left","Balra teszem"],["right","Jobbra teszem"],["off","Leveszem"]];
    const placementButtons = targets.map(([id,label])=>
      `<button class="button" type="button" data-action="s3-scale-target" data-value="${id}" data-s3-focus="target-${id}" aria-pressed="${model.target===id}">${label}</button>`).join("");
    const putWeights = weights.map(weight=>{
      const at = layout[weight-1];
      return `<button class="scale-weight" type="button" data-place="${at}" data-action="s3-scale-weight" data-value="${weight}" data-s3-focus="weight-${weight}"
        aria-label="${weight}. súly, ${placementLabel[at]}">${weight}<small aria-hidden="true">${{left:"B",right:"J","":"·"}[at]}</small></button>`;
    }).join("");
    const balanceEditor = oneLeft
      ? `<p>Már csak egy súly maradt gyanús (${suspects[0]}). Ennél a kimenetelnél elég volt az első mérés.</p>`
      : `<div class="cluster" role="group" aria-label="Súly elhelyezése">${placementButtons}</div>
        <div class="scale-weights" aria-label="A kilenc súly">${putWeights}</div>
        <div class="scale-trays">${tray(layout,"left")}${tray(layout,"right")}</div>
        <p class="muted">Mindkét serpenyőbe ugyanannyi súlyt tegyél.</p>`;
    const branchNote = isFirst
      ? valid(model.first) ? "Most tervezd meg, mit mérnél a három lehetséges kimenetelnél." : ""
      : `Még gyanús súlyok (${asList(suspects)}).`;
    return `<section class="activity" aria-label="Virtuális mérleg">
      <h2>Próbáld ki a mérési terved!</h2>
      <p>Válassz serpenyőt, majd jelöld ki a súlyokat. A második mérést az első eredménye alapján tervezd meg.</p>
      <div class="cluster activity-steps" role="group" aria-label="Első mérés és a második mérés ágai">${stageButtons}</div>
      ${branchNote ? `<p class="activity-note">${branchNote}</p>` : ""}
      ${balanceEditor}
      <div class="cluster activity-actions">
        <button class="button primary" type="button" data-action="s3-scale-test" data-s3-focus="scale-test">Kipróbálom mind a 9 súllyal</button>
        ${successful ? `<button class="button" type="button" data-action="s3-scale-copy" data-s3-focus="scale-copy">Beillesztem a tervet a válaszomba</button>`:""}
      </div>
      <p class="feedback" role="status" data-result="${successful?"correct":""}">${escape(reportScale(result))}</p>
    </section>`;
  }

  function truthComplete(marks) {
    return marks.every(mark=>typeof mark==="boolean");
  }

  function truthResult(model, index) {
    if (!model.tested[index]) return "";
    const marks=model.marks[index], suspect=personas[index];
    if (!truthComplete(marks)) return "Jelöld meg, mely állítások igazak és melyek hamisak ebben a sorban.";
    const count=truthFor(suspect).filter((value,i)=>value===marks[i]).length;
    if (count!==4) return `${count} állítást jelöltél helyesen a négyből. Nézd át a kiemelt cellákat.`;
    const yes=marks.filter(Boolean).length;
    return `Ha ${suspect} a tettes, ${yes} igaz és ${4-yes} hamis állítás hangzik el.`;
  }

  function truthHtml(record) {
    const model = truthState(record);
    const rows = personas.map((suspect,row)=>{
      const marks=model.marks[row], expected=truthFor(suspect);
      const tested=model.tested[row]&&truthComplete(marks);
      const th=`<th scope="row"><button class="truth-name" type="button" data-action="s3-truth-row" data-value="${row}" data-s3-focus="truth-row-${row}" aria-pressed="${model.selected===row}">${escape(suspect)}</button></th>`;
      const cells=marks.map((mark,col)=>{
        const sign=mark===null?"?":mark?"I":"H";
        const verbal=mark===null?"nincs jelölve":mark?"igaz":"hamis";
        return `<td><button class="truth-cell" type="button" data-action="s3-truth-mark" data-row="${row}" data-value="${col}" data-s3-focus="truth-mark-${row}-${col}" data-sign="${sign}" data-checked="${tested?(mark===expected[col]?"correct":"wrong"):""}"
          aria-label="A feltételezett tettes ${escape(suspect)}. ${escape(personas[col])} állítása ${verbal}${tested?(mark===expected[col]?". Helyes jelölés.":". Próbáld újra."):""}">${sign}</button></td>`;
      }).join("");
      return `<tr class="${model.selected===row?"selected":""}">${th}${cells}</tr>`;
    }).join("");
    const marks=model.marks[model.selected];
    const correct=model.tested[model.selected]&&marks.every((mark,col)=>mark===truthFor(personas[model.selected])[col]);
    return `<section class="activity" aria-label="Igaz–hamis tábla">
      <h2>Ki mondana igazat?</h2>
      <p>Válassz feltételezett tettest. A sorában kattints az állításokra. Az I igazat, a H hamisat jelöl.</p>
      <table class="truth-table"><thead><tr><th scope="col">Tettes</th>${personas.map(name=>`<th scope="col">${escape(name)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table>
      <button class="button" type="button" data-action="s3-truth-check" data-s3-focus="truth-check">Ellenőrzöm a kijelölt sort</button>
      <p class="feedback" role="status" data-result="${correct?"correct":""}">${escape(truthResult(model,model.selected))}</p>
    </section>`;
  }

  function handle(button, task, record) {
    const {action,value,row,s3Focus}=button.dataset;
    if (!action?.startsWith("s3-")) return false;
    if (task.activity==="scale") {
      const model=scaleState(record);
      if (action==="s3-scale-stage") model.stage=value;
      if (action==="s3-scale-target") model.target=value;
      if (action==="s3-scale-weight") {
        const layout=model.stage==="first"?model.first:model.second[model.stage];
        const index=Number(value)-1;
        const target=model.target==="off"?"":model.target;
        layout[index]=layout[index]===target?"":target;
        model.tested=false;
      }
      if (action==="s3-scale-test") model.tested=true;
      if (action==="s3-scale-copy" && checkScalePlan(model).type==="success") {
        attachPlan(savedPlan(model));
        return true;
      }
    }
    if (task.activity==="truth") {
      const model=truthState(record);
      if (action==="s3-truth-row") model.selected=Number(value);
      if (action==="s3-truth-mark") {
        model.selected=Number(row);
        const marks=model.marks[model.selected];
        const col=Number(value);
        marks[col]=marks[col]===null?true:marks[col]===true?false:null;
        model.tested[model.selected]=false;
      }
      if (action==="s3-truth-check") model.tested[model.selected]=true;
    }
    save();
    redraw(s3Focus);
    return true;
  }

  return {handle, html(task,record) {
    if (task.activity==="scale") return scaleHtml(record);
    if (task.activity==="truth") return truthHtml(record);
    return "";
  }};
}

  function syncFeedback(message = "", result = "") {
    const task = activeTask();

    for (const field of task.fields) {

  function parseList(typed, sort) {
    const cleaned = typed.trim().replace(/^[([]\s*|\s*[)\]]$/g, "");
    const parts = cleaned ? cleaned.split(/[,\s]+/) : [];
    if (!parts.length || !parts.every(part => /^\+?\d+°?$/.test(part))) return null;

  function evaluate(field, value) {
    if (field.kind === "cards") {
      if (!Array.isArray(value) || !value.length) return "empty";
      return value.length === field.answer.length && field.answer.every(card => value.includes(card)) ? "correct" : "retry";
    }
    const typed = answerText(value);
    if (!typed) return "empty";
    if (field.kind === "text") return "written";
    if (field.kind === "number") {
      const input = field.label.includes("fokban") ? typed.replace(/\s*°$/, "") : typed;
      return /^\+?\d+$/.test(input) && Number(input) === field.answer ? "correct" : "retry";
    }
    if (field.kind === "numberSet" || field.kind === "numberSequence") {
      const ordered = field.kind === "numberSequence";
      const got = parseList(typed, !ordered);
      if (!got) return "format";
      const expected = ordered ? field.answer : [...field.answer].sort((a,b) => a-b);
      return got.length === expected.length && got.every((item,index) => item === expected[index]) ? "correct" : "retry";
    }
    if (field.kind === "numberGroups") {
      const groups = typed.split(/[;/|]/).map(group => parseList(group,true));
      if (groups.some(group => group === null)) return "format";
      const key = groups => groups.map(group => [...group].sort((a,b) => a-b).join(",")).sort().join("|");
      return key(groups) === key(field.answer) ? "correct" : "retry";

    const hasReflection = task.fields.some(field => field.kind === "text");
    for (const field of task.fields) record.checked[field.id] = evaluate(field,record.answers[field.id]);
    const allCorrect = task.fields.filter(field => field.kind !== "text")
      .every(field => record.checked[field.id] === "correct");
    let message = "";
    if (!hasReflection && allCorrect) {

  function writeAnswer(fieldId, value) {

  function visit(index) {

  function drawSummary() {
    const counts = tally(set);

    const title = remaining === 0 ? "Végigértél a feladatsoron!" : counts.solved || counts.reviewed ? "Szép munka!" : "A feladatsor állása";
    const detail = remaining === 0 ? "Bármelyik feladathoz visszanézhetsz." : `Még ${remaining} feladathoz visszatérhetsz.`;
    const list = set.tasks.map((task,i) => `<li><button class="summary-link" type="button" data-action="task" data-value="${i}">
      <span>${i + 1}. ${escape(task.title)}</span><span>${recordFor(set,task).selfReviewed ? "Önellenőrzéssel megoldva" : statusLabels[status(set,task)]}</span></button></li>`).join("");
    screen(`<section class="hero"><div><h1 id="jh-title" tabindex="-1">${title}</h1>
      <p>${counts.solved} megoldva · ${counts.reviewed} megoldás átnézve. ${detail}</p></div></section>
      <section class="surface"><h2>${escape(set.title)}</h2><ul class="summary-list">${list}</ul></section>`,
      `<button class="button" type="button" data-action="home">Feladatsorok</button>`);
    root.querySelector("#jh-title").focus();
  }

  root.addEventListener("input", event => {
    const target = event.target;
    if (page === "home" && target.id === "jh-search") {
      query = target.value;
      drawResults();
    }
    if (page === "task" && target.dataset.input) writeAnswer(target.dataset.input, target.value);
  });

  root.addEventListener("submit", event => {
    if (event.target.id !== "jh-form") return;
    event.preventDefault();
    submit();
  });

  root.addEventListener("click", event => {
    const button = event.target.closest("button[data-action]");
    if (!button || button.disabled) return;
    if (page==="task" && activities.handle(button,activeTask(),recordFor(set,activeTask()))) return;
    const {action,value,field:id} = button.dataset;
    switch (action) {
      case "topic":
        topic = value;

        break;
      case "tag-suggestion":
      case "tag":

          query = "";
          root.querySelector("#jh-search").value = "";
        }
        tag = tag === value ? "" : value;
        root.querySelector("#jh-browse-tags").open = false;
        drawResults();
        root.querySelector(tag ? "#jh-selected-tag button" : "#jh-search").focus({preventScroll:true});
        break;
      case "open":
        set = sets.find(series => series.id === value);
        if (set) visit(bucketFor(set).cursor);
        break;
      case "home":
        page = "home";
        drawHome(true);
        break;
      case "task":
        visit(Number(value));
        break;
      case "back":
        visit(current - 1);
        break;
      case "next":
        visit(current + 1);
        break;
      case "summary":
        page = "summary";
        drawSummary();
        break;
      case "hint": {
        const task = activeTask();
        const record = recordFor(set,task);
        record.hints = Math.min(record.hints + 1,task.hints.length);
        save();
        syncFigure();
        syncSupport();
        syncProgress();
        break;
      }
      case "solution": {
        const record = recordFor(set,activeTask());
        record.visibleSolution = !record.visibleSolution;
        if (record.visibleSolution) record.opened = true;
        save();
        syncSupport();
        syncProgress();
        break;
      }
      case "confirm-reflection": {
        const task = activeTask();
        const record = recordFor(set,task);
        if (!record.visibleSolution || !canConfirmReflection(task,record)) break;
        record.solved = record.selfReviewed = true;
        save();
        syncProgress();
        syncSupport();
        syncFeedback("Megoldottad, és az indoklásodat is ellenőrizted.", "correct");
        root.querySelector("#jh-solution-title").focus({preventScroll:true});
        break;
      }
      case "option": {
        const task = activeTask();
        const field = task.fields.find(item => item.id === id);
        const valueBefore = recordFor(set,task).answers[id];
        const alreadySelected = optionSelected(field,valueBefore,value);
        let answer = value;
        if (field.kind === "cards") {
          const selection = Array.isArray(valueBefore) ? valueBefore : [];
          answer = alreadySelected ? selection.filter(item => item !== value) : [...selection,value];
        }
        writeAnswer(id,answer);
        for (const option of root.querySelectorAll(`[data-field="${id}"]`)) {
          option.setAttribute("aria-pressed",String(optionSelected(field,answer,option.dataset.value)));
        }
        break;
      }
    }
  });

  drawHome(false);
}

  startJatszohaz(
    document.getElementById("matek-jatszohaz"),
    read("jatszohaz-feladatsorok"),
    window,
    read("jatszohaz-abrai"),
    read("jatszohaz-abra-segitsegei"),
    createSprintActivities,
    createScaleRules()
  );
})();
</script>
