<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matematika Játszóház</title>
  <style>body { margin: 0; background: #f5f5fc; }</style>
  <style>
#matek-jatszohaz {
  --ink:#202342; --muted:#505673; --paper:#f5f5fc; --line:#dedff0;
  --accent:#4935a9; --pale:#eae4ff; --navy:#26224b; --green:#126342;
  --soft-green:#e5f6ed; --warm:#fff0db; --brown:#743e13;
  box-sizing:border-box; width:100%; min-height:500px; padding:clamp(14px,4vw,40px);
  background:var(--paper); color:var(--ink); font:400 1rem/1.55 system-ui,sans-serif; border-radius:22px;
}
#matek-jatszohaz *, #matek-jatszohaz *::before, #matek-jatszohaz *::after { box-sizing:border-box }
#matek-jatszohaz h1, #matek-jatszohaz h2, #matek-jatszohaz h3, #matek-jatszohaz p { margin:0 }
#matek-jatszohaz h1, #matek-jatszohaz h2 { line-height:1.14; letter-spacing:-.035em; text-wrap:balance }
#matek-jatszohaz h1 { font-size:clamp(1.5rem,4.8vw,2.45rem) }
#matek-jatszohaz h2 { font-size:clamp(1.35rem,4vw,2rem) }
#matek-jatszohaz button, #matek-jatszohaz input, #matek-jatszohaz textarea { font:inherit }
#matek-jatszohaz button { cursor:pointer }
#matek-jatszohaz button:disabled { cursor:default }
#matek-jatszohaz button:focus-visible, #matek-jatszohaz input:focus-visible, #matek-jatszohaz textarea:focus-visible { outline:3px solid #9773ee; outline-offset:3px }
#matek-jatszohaz .wrap { max-width:840px; margin:auto }
#matek-jatszohaz .top, #matek-jatszohaz .brand, #matek-jatszohaz .cluster { display:flex; align-items:center; flex-wrap:wrap; gap:10px }
#matek-jatszohaz .top { justify-content:space-between; margin-bottom:22px }
#matek-jatszohaz .brand { flex-wrap:nowrap; font-weight:750; letter-spacing:-.025em }
#matek-jatszohaz .mark { display:grid; place-items:center; width:40px; height:40px; border-radius:12px; color:#fff; background:var(--accent); font-size:1.6rem }
#matek-jatszohaz .hero { position:relative; isolation:isolate; overflow:hidden; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:20px; align-items:center; padding:clamp(18px,4vw,30px); margin-bottom:18px; border-radius:19px; background:var(--navy); color:#fff }
#matek-jatszohaz .hero::after { content:""; position:absolute; z-index:-1; right:-70px; top:-155px; width:240px; height:240px; border:36px solid #42386e; border-radius:50% }
#matek-jatszohaz .hero p { margin-top:7px; color:#e3ddff }
#matek-jatszohaz .hero-cards { display:flex; align-items:center; padding-right:8px }
#matek-jatszohaz .hero-cards span { display:grid; place-items:center; width:45px; height:61px; border-radius:9px; box-shadow:0 5px 14px #1e193b70; font-weight:800; font-size:1.38rem; background:#e5d8ff; color:#36225d; transform:rotate(-13deg) }
#matek-jatszohaz .hero-cards span + span { margin-left:-8px; background:#ffd498; color:#4b2e25; transform:rotate(10deg) }
#matek-jatszohaz .surface { padding:clamp(15px,3.8vw,27px); border:1px solid var(--line); border-radius:18px; background:#fff }
#matek-jatszohaz .catalog { margin-top:16px; display:grid; gap:14px }
#matek-jatszohaz .set-card { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:start; gap:15px }
#matek-jatszohaz .set-card .cluster { margin-top:10px }
#matek-jatszohaz .set-card p, #matek-jatszohaz .meta { color:var(--muted) }
#matek-jatszohaz .set-card h2 { margin-bottom:5px }
#matek-jatszohaz .matched { margin-top:9px }
#matek-jatszohaz .tag, #matek-jatszohaz .button, #matek-jatszohaz .task-link, #matek-jatszohaz .answer-card {
  min-height:44px; padding:8px 14px; border:1px solid var(--line); border-radius:10px; color:var(--ink); background:#fff; font-weight:650;
}
#matek-jatszohaz .tag { border-radius:24px; font-size:.9rem; color:var(--accent) }
#matek-jatszohaz .tag[aria-pressed=true], #matek-jatszohaz .answer-card[aria-pressed=true] { background:var(--pale); border-color:var(--accent); color:var(--accent) }

#matek-jatszohaz textarea { resize:vertical; min-height:96px }
#matek-jatszohaz .search-area label { display:block; margin-bottom:9px; font-weight:650 }
#matek-jatszohaz .task-nav { display:grid; grid-template-columns:repeat(auto-fit,minmax(44px,1fr)); gap:6px; margin:10px 0 15px }
#matek-jatszohaz .task-link { padding:5px 2px; font-variant-numeric:tabular-nums }

#matek-jatszohaz .task-body { margin:12px 0 20px }

<script>const data = document.getElementById("jatszohaz-feladatsorok");
(function startJatszohaz(root, sets, browser) {
  const storageKey = "matematika-jatszohaz/progress/1";
  const statusLabels = {
    pending: "Hátravan", started: "Folyamatban", solved: "Megoldottad", reviewed: "Megoldást megnézted"
  };
  let progress = {};
  let canSave = false;
  try {
    const storage = browser.localStorage;
    const probeKey = storageKey + "/probe";
    storage.setItem(probeKey, "1");
    storage.removeItem(probeKey);
    canSave = true;
    const saved = JSON.parse(storage.getItem(storageKey) || "{}");
    if (saved && typeof saved === "object" && !Array.isArray(saved)) progress = saved;
  } catch {}
  let page = "home";
  let query = "";
  let tag = "";
  let set = null;
  let current = 0;

  const escape = value => String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[c]);
  const normalize = value => value.normalize("NFD").replace(/\p{Diacritic}/gu, "").toLocaleLowerCase("hu");
  const sortTags = tags => [...new Set(tags)].sort((a,b) => a.localeCompare(b, "hu"));
  const setTags = series => sortTags(series.tasks.flatMap(task => task.tags));
  const allTags = sortTags(sets.flatMap(setTags));
  const bucketFor = series => progress[series.id] ??= { cursor: 0, tasks: {} };
  const recordFor = (series, task) => bucketFor(series).tasks[task.id] ??= {
    answers: {}, checked: {}, hints: 0, opened: false, visibleSolution: false, solved: false
  };
  const activeTask = () => set.tasks[current];

  function save() {
    if (!canSave) return;
    try {
      browser.localStorage.setItem(storageKey, JSON.stringify(progress));
    } catch {
      canSave = false;
      const note = root.querySelector("#jh-save");
      if (note) note.textContent = "A haladás ebben a megnyitásban marad meg.";
    }
  }

  function status(series, task) {
    const record = recordFor(series, task);
    if (record.solved) return "solved";
    if (record.opened) return "reviewed";
    if (record.hints || Object.values(record.answers).some(answer => Array.isArray(answer) ? answer.length : String(answer).trim())) return "started";
    return "pending";
  }

  function tally(series) {
    const counts = { pending: 0, started: 0, solved: 0, reviewed: 0 };
    for (const task of series.tasks) counts[status(series, task)]++;
    return counts;
  }

  function screen(body, toolbar = "") {
    root.innerHTML = `<div class="wrap">
      <header class="top"><div class="brand"><span class="mark" aria-hidden="true">∴</span> Matematika Játszóház</div>${toolbar}</header>
      ${body}
    </div>`;
  }

  function drawHome(focus) {
    screen(`<section class="hero">
      <div><h1 tabindex="-1" id="jh-title">Válassz feladatsort!</h1><p>Matematika szakkör · 7. évfolyam</p></div>
      <div class="hero-cards" aria-hidden="true"><span>?</span><span>!</span></div>
    </section>
    <section class="surface search-area" aria-label="Feladatsorok keresése">
      <label for="jh-search">Keresés cím vagy téma szerint</label>
      <input id="jh-search" type="search" placeholder="Például oszthatóság" value="${escape(query)}">
      <div id="jh-tags" class="cluster" style="margin-top:12px" aria-label="Témák"></div>
    </section>
    <section id="jh-catalog" class="catalog" aria-label="Feladatsorok" aria-live="polite"></section>`);
    drawResults();
    if (focus) root.querySelector("#jh-title").focus();
  }

  function drawResults() {
    const tokens = normalize(query.trim()).split(/\s+/).filter(Boolean);
    const tags = root.querySelector("#jh-tags");
    if (!tags.childElementCount) {
      tags.innerHTML = ["", ...allTags].map(option => `<button class="tag" type="button" data-action="tag" data-value="${escape(option)}" aria-pressed="false">${escape(option || "Mind")}</button>`).join("");
    }
    for (const chip of tags.querySelectorAll("button")) chip.setAttribute("aria-pressed", String(chip.dataset.value === tag));
    const matches = sets.flatMap(series => {
      const tasks = series.tasks.filter(task => {
        if (tag && !task.tags.includes(tag)) return false;
        const terms = normalize([series.title, task.title, ...task.tags].join(" "));
        return tokens.every(token => terms.includes(token));
      });
      return tasks.length ? [{series,tasks}] : [];
    });
    const catalog = root.querySelector("#jh-catalog");
    catalog.innerHTML = matches.length ? matches.map(({series,tasks}) => {
      const counts = tally(series);
      const started = bucketFor(series).opened;
      const hasFilter = tag || tokens.length;
      const matchedNumbers = tasks.map(task => series.tasks.indexOf(task) + 1).join(", ");
      const matchedDetails = hasFilter ? `<p class="matched">Illeszkedő feladatok · ${matchedNumbers}</p>` : "";
      const tagsHtml = setTags(series).map(topic => `<span class="tag-label">${escape(topic)}</span>`).join("");
      return `<article class="surface set-card">
        <div><h2>${escape(series.title)}</h2>
        <p>${escape(series.description)}</p>
        <p>${series.tasks.length} feladat${started ? ` · ${counts.solved} megoldva` : ""}</p>
        ${matchedDetails}<div class="cluster">${tagsHtml}</div></div>
        <button class="button primary" type="button" data-action="open" data-value="${escape(series.id)}">${started ? "Folytatom" : "Kezdem"}</button>
      </article>`;
    }).join("") : `<p class="surface">Ehhez a kereséshez nincs találat.</p>`;
  }

  function taskButtons() {
    return set.tasks.map((task, index) => {
      const state = status(set, task);
      const symbol = {solved:" ✓", reviewed:" ◐", started:" ·", pending:""}[state];
      return `<button class="task-link" type="button" data-action="task" data-value="${index}" data-status="${state}" ${index === current ? 'aria-current="step"' : ""}
        aria-label="${index + 1}. feladat – ${statusLabels[state]}" title="${escape(task.title)} · ${statusLabels[state]}">${index + 1}${symbol}</button>`;
    }).join("");
  }

  function optionSelected(field, value, option) {
    return field.kind === "cards" ? Array.isArray(value) && value.includes(option) : value === option;
  }

  function fieldHtml(field, record) {
    const id = "jh-field-" + field.id;
    const value = record.answers[field.id];
    const feedbackId = "jh-feedback-" + field.id;
    const note = `<p id="${feedbackId}" class="field-feedback" role="status"></p>`;
    if (field.options) {
      const buttons = field.options.map(option => `<button type="button" class="answer-card"
        data-action="option" data-field="${escape(field.id)}" data-value="${escape(option)}"
        aria-pressed="${optionSelected(field,value,option)}">${escape(option)}</button>`).join("");
      return `<div class="field"><fieldset aria-describedby="${feedbackId}"><legend>${escape(field.label)}</legend>
        <div class="${field.kind === "cards" ? "playing-cards" : "options"}">${buttons}</div>${note}</fieldset></div>`;
    }
    const attrs = `id="${id}" data-input="${escape(field.id)}" aria-describedby="${feedbackId}"`;
    const input = field.kind === "text"
      ? `<textarea ${attrs} maxlength="3000" rows="3"></textarea>`
      : `<input type="text" inputmode="numeric" autocomplete="off" maxlength="12" value="${escape(value)}" ${attrs}>`;
    return `<div class="field"><label for="${id}">${escape(field.label)}</label>${input}${note}</div>`;
  }

  function drawTask(focus) {
    const task = activeTask();
    const record = recordFor(set,task);
    const isReflection = task.fields.every(field => field.kind === "text");
    screen(`<section class="surface" aria-label="${escape(set.title)}">
      <div class="cluster" style="justify-content:space-between"><strong>${escape(set.title)}</strong><span class="meta" id="jh-count"></span></div>
      <nav class="task-nav" id="jh-task-nav" aria-label="Feladatválasztó"></nav>
      <h1 id="jh-title" tabindex="-1">${escape(task.title)}</h1>
      <p class="task-body">${escape(task.text)}</p>
      <form id="jh-form" novalidate>
        ${task.fields.map(field => fieldHtml(field,record)).join("")}
        <div class="cluster">
          <button class="button primary" type="submit">${isReflection ? "Összevetem a mintával" : "Ellenőrzés"}</button>
          <button class="button" type="button" id="jh-hint" data-action="hint">Segítséget kérek</button>
          <button class="button" type="button" id="jh-solution" data-action="solution" aria-controls="jh-support">Mutasd a megoldást</button>
        </div>
      </form>
      <p class="feedback" id="jh-feedback" role="status"></p>
      <div class="support" id="jh-support" aria-live="polite"></div>
      <div class="cluster footer">
        <button class="button" type="button" data-action="back" ${current === 0 ? "disabled" : ""}>Előző feladat</button>
        <button class="button" type="button" data-action="${current === set.tasks.length - 1 ? "summary" : "next"}">${current === set.tasks.length - 1 ? "Összegzés" : "Következő feladat"}</button>
      </div>
      <p class="muted" id="jh-save" style="margin-top:12px">${canSave ? "A válaszaid ebben a böngészőben maradnak." : "A haladás ebben a megnyitásban marad meg."}</p>
    </section>`, `<div class="cluster"><button class="button" type="button" data-action="home">Feladatsorok</button><button class="button" type="button" data-action="summary">Összegzés</button></div>`);
    for (const field of task.fields) {
      if (field.kind === "text") root.querySelector("#jh-field-" + field.id).value = record.answers[field.id] ?? "";
    }
    syncProgress();
    syncSupport();
    syncFeedback();
    if (focus) root.querySelector("#jh-title").focus();
  }

  function syncProgress() {
    const counts = tally(set);
    root.querySelector("#jh-count").textContent = `${counts.solved} / ${set.tasks.length} megoldva`;
    const nav = root.querySelector("#jh-task-nav");
    const next = taskButtons();
    if (nav.dataset.markup !== next) {
      nav.innerHTML = next;
      nav.dataset.markup = next;
    }
  }

  function syncSupport() {
    const task = activeTask();
    const record = recordFor(set, task);
    const help = root.querySelector("#jh-hint");
    help.disabled = record.hints >= task.hints.length;
    help.textContent = record.hints === 0 ? "Segítséget kérek"
      : help.disabled ? "Mindkét segítség látható" : "Még egy segítség";
    const solve = root.querySelector("#jh-solution");
    solve.textContent = record.visibleSolution ? "Elrejtem a megoldást" : "Mutasd a megoldást";
    solve.setAttribute("aria-expanded", String(record.visibleSolution));
    root.querySelector("#jh-support").innerHTML =
      task.hints.slice(0, record.hints).map((hint,i) => `<section><h3>${i + 1}. segítség</h3><p>${escape(hint)}</p></section>`).join("")
      + (record.visibleSolution ? `<section class="solution"><h3>Megoldás</h3><p>${escape(task.solution)}</p></section>` : "");
  }

  function syncFeedback(message = "", result = "") {
    const task = activeTask();
    const record = recordFor(set, task);
    const messages = {correct:"Helyes.", retry:"Gondold át még egyszer.", empty:"Itt még nincs válasz."};
    for (const field of task.fields) {
      const target = root.querySelector("#jh-feedback-" + field.id);
      target.dataset.result = record.checked[field.id] ?? "";
      target.textContent = messages[record.checked[field.id]] ?? "";
    }
    const general = root.querySelector("#jh-feedback");
    general.dataset.result = result;
    general.textContent = message;
  }

  function evaluate(field, value) {
    if (field.kind === "cards") {
      if (!Array.isArray(value) || !value.length) return "empty";
      return value.length === field.answer.length && field.answer.every(card => value.includes(card)) ? "correct" : "retry";
    }
    const typed = String(value ?? "").trim();
    if (!typed) return "empty";
    const correct = field.kind === "number" ? /^\+?\d+$/.test(typed) && Number(typed) === field.answer : typed === field.answer;
    return correct ? "correct" : "retry";
  }

  function submit() {
    const task = activeTask();
    const record = recordFor(set,task);
    const checkedFields = task.fields.filter(field => field.kind !== "text");
    if (!checkedFields.length) {
      if (!task.fields.some(field => String(record.answers[field.id] ?? "").trim())) {
        syncFeedback("Írd le előbb a saját ötletedet, vagy nyisd meg a megoldást.");
        return;
      }
      record.opened = record.visibleSolution = true;
      syncSupport();
      syncFeedback("Nézd meg, miben egyezik a két gondolatmenet.");
    } else {
      for (const field of checkedFields) record.checked[field.id] = evaluate(field,record.answers[field.id]);
      const allCorrect = checkedFields.every(field => record.checked[field.id] === "correct");
      if (allCorrect && !record.opened) record.solved = true;
      const message = allCorrect ? "Szép munka, minden válaszod helyes." : "";
      syncFeedback(message, allCorrect ? "correct" : "");
    }
    save();
    syncProgress();
  }

  function writeAnswer(fieldId, value) {
    const record = recordFor(set,activeTask());
    record.answers[fieldId] = value;
    if (record.checked[fieldId]) {
      delete record.checked[fieldId];
      record.solved = false;
    }
    save();
    syncProgress();
    syncFeedback();
  }

  function visit(index) {
    page = "task";
    current = Math.max(0, Math.min(index,set.tasks.length - 1));
    const bucket = bucketFor(set);
    bucket.opened = true;
    bucket.cursor = current;
    save();
    drawTask(true);
  }

  function drawSummary() {
    const counts = tally(set);
    const remaining = counts.pending + counts.started;
    const title = remaining === 0 ? "Végigértél a feladatsoron!" : counts.solved || counts.reviewed ? "Szép munka!" : "A feladatsor állása";
    const detail = remaining === 0 ? "Bármelyik feladathoz visszanézhetsz." : `Még ${remaining} feladathoz visszatérhetsz.`;
    const list = set.tasks.map((task,i) => `<li><button class="summary-link" type="button" data-action="task" data-value="${i}">
      <span>${i + 1}. ${escape(task.title)}</span><span>${statusLabels[status(set,task)]}</span></button></li>`).join("");
    screen(`<section class="hero"><div><h1 id="jh-title" tabindex="-1">${title}</h1>
      <p>${counts.solved} megoldva · ${counts.reviewed} megoldás átnézve. ${detail}</p></div></section>
      <section class="surface"><h2>${escape(set.title)}</h2><ul class="summary-list">${list}</ul></section>`,
      `<button class="button" type="button" data-action="home">Feladatsorok</button>`);
    root.querySelector("#jh-title").focus();
  }

  root.addEventListener("input", event => {
    const target = event.target;
    if (page === "home" && target.id === "jh-search") {
      query = target.value;
      drawResults();
    }
    if (page === "task" && target.dataset.input) writeAnswer(target.dataset.input, target.value);
  });

  root.addEventListener("submit", event => {
    if (event.target.id !== "jh-form") return;
    event.preventDefault();
    submit();
  });

  root.addEventListener("click", event => {
    const button = event.target.closest("button[data-action]");
    if (!button || button.disabled) return;
    const {action,value,field:id} = button.dataset;
    switch (action) {
      case "tag":
        tag = tag === value ? "" : value;
        drawResults();
        break;
      case "open":
        set = sets.find(series => series.id === value);
        if (set) visit(bucketFor(set).cursor);
        break;
      case "home":
        page = "home";
        drawHome(true);
        break;
      case "task":
        visit(Number(value));
        break;
      case "back":
        visit(current - 1);
        break;
      case "next":
        visit(current + 1);
        break;
      case "summary":
        page = "summary";
        drawSummary();
        break;
      case "hint": {
        const task = activeTask();
        const record = recordFor(set,task);
        record.hints = Math.min(record.hints + 1,task.hints.length);
        save();
        syncSupport();
        syncProgress();
        break;
      }
      case "solution": {
        const record = recordFor(set,activeTask());
        record.visibleSolution = !record.visibleSolution;
        if (record.visibleSolution) record.opened = true;
        save();
        syncSupport();
        syncProgress();
        break;
      }
      case "option": {
        const task = activeTask();
        const field = task.fields.find(item => item.id === id);
        const valueBefore = recordFor(set,task).answers[id];
        const alreadySelected = optionSelected(field,valueBefore,value);
        let answer = value;
        if (field.kind === "cards") {
          const selection = Array.isArray(valueBefore) ? valueBefore : [];
          answer = alreadySelected ? selection.filter(item => item !== value) : [...selection,value];
        }
        writeAnswer(id,answer);
        for (const option of root.querySelectorAll(`[data-field="${id}"]`)) {
          option.setAttribute("aria-pressed",String(optionSelected(field,answer,option.dataset.value)));
        }
        break;
      }
    }
  });

  drawHome(false);
})(document.getElementById("matek-jatszohaz"), JSON.parse(data.textContent), window);</script>
<noscript>A feladatok használatához engedélyezd a JavaScriptet.</noscript>
